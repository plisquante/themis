<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/themis/assets/logo-128.png">
<title>Sayfa bulunamadı · Themis</title>
<meta name="theme-color" content="#13110e">
<link rel="stylesheet" href="/themis/css/style.css">
<style>
.lost{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px}
.lost img{width:120px;height:120px;margin-bottom:28px;opacity:.9}
.lost .kicker{margin-bottom:16px}
.lost h1{font-family:var(--serif);font-size:72px;line-height:1.05;letter-spacing:.01em;color:var(--cream);margin:0 0 18px}
.lost h1 em{font-weight:400}
.lost h1 em{font-style:italic;color:var(--gold)}
.lost p{color:var(--muted);max-width:460px;margin:0 auto 34px;line-height:1.7}
.lost .btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
@media (max-width:760px){.lost h1{font-size:44px;letter-spacing:.01em;margin:0 0 18px}}
</style>
</head>
<body>
<div class="vignette"></div>
<main class="lost">
  <img src="/themis/assets/logo-128.png" alt="Themis logosu">
  <div class="kicker">// 404</div>
  <h1>Terazide <em>böyle bir sayfa yok.</em></h1>
  <p>Aradığınız sayfa taşınmış ya da hiç var olmamış olabilir. Ana sayfaya ya da wikiye dönün.</p>
  <div class="btns"><a class="btn p" href="/themis/">&gt; Ana Sayfa</a><a class="btn s" href="/themis/wiki/">Wiki_</a></div>
</main>
</body>
</html>
